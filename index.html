<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界のiting名言ジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      color: #4da6ff;
    }
    .card {
      background: #2b2b2b;
      border-left: 5px solid #4da6ff;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-align: left;
    }
    .quote {
      font-size: 1.1rem;
      line-height: 1.6;
      font-style: italic;
      color: #e0e0e0;
    }
    .author {
      margin-top: 15px;
      text-align: right;
      font-weight: bold;
      color: #4da6ff;
    }
    .btn {
      background-color: #4da6ff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #0073e6;
    }
    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>世界のiting名言ジェネレーター</h1>
    <button class="btn" onclick="fetchQuote()">別の名言を取得する</button>
    
    <div id="loading">名言を取得中...</div>
    <div id="quote-card" class="card" style="display: none;">
      <div class="quote" id="quote-text"></div>
      <div class="author" id="quote-author"></div>
    </div>
  </div>

  <script>
    async function fetchQuote() {
      const loadingEl = document.getElementById('loading');
      const cardEl = document.getElementById('quote-card');
      
      loadingEl.style.display = 'block';
      cardEl.style.display = 'none';

      try {
        // Quotable APIからランダムな名言を取得
        const response = await fetch('https://api.quotable.io/random');
        
        if (!response.ok) {
          throw new Error(`HTTPエラー! ステータス: ${response.status}`);
        }

        const data = await response.json();

        // 取得したデータ（content: 名言本文, author: 著者名）をセット
        document.getElementById('quote-text').textContent = `“ ${data.content} ”`;
        document.getElementById('quote-author').textContent = `— ${data.author}`;

        loadingEl.style.display = 'none';
        cardEl.style.display = 'block';

      } catch (error) {
        console.error('エラー発生:', error);
        loadingEl.textContent = 'データの取得に失敗しました。再度の試行をお願いします。';
      }
    }

    // ページ読み込み時に実行
    fetchQuote();
  </script>

</body>
</html>
