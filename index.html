<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の名言 ＆ ランダムGIFジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      color: #4da6ff;
      margin-bottom: 20px;
    }
    .toggle-buttons {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .toggle-btn {
      background-color: #333;
      color: #aaa;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toggle-btn.active {
      background-color: #4da6ff;
      color: #fff;
      border-color: #4da6ff;
    }
    .btn {
      background-color: #4da6ff;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 25px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0073e6;
    }
    
    /* 3カラムレイアウト： [左GIF (250px)] [中央名言 (1fr)] [右GIF (250px)] */
    .content-grid {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 20px;
      align-items: center;
      text-align: left;
    }

    /* 画面サイズが狭い（スマホ等）場合は1列に並べる */
    @media (max-width: 850px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #2b2b2b;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    /* 中央：名言カード */
    .quote-card {
      border-left: 5px solid #4da6ff;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .quote-ja {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .quote-en {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #bbb;
      font-style: italic;
    }
    .author {
      margin-top: 15px;
      text-align: right;
      font-weight: bold;
      color: #4da6ff;
    }

    /* 左右：GIFカード */
    .gif-card {
      border-top: 4px solid #ff4d88;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      padding: 10px;
    }
    .gif-card img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 6px;
      object-fit: contain;
    }

    .status-msg {
      text-align: center;
      font-size: 1.1rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>世界の名言 ＆ ランダムGIF</h1>
    
    <!-- 言語切り替えボタン -->
    <div class="toggle-buttons">
      <button class="toggle-btn active" onclick="switchMode('both')">両方表示</button>
      <button class="toggle-btn" onclick="switchMode('ja')">日本語のみ</button>
      <button class="toggle-btn" onclick="switchMode('en')">English</button>
    </div>

    <!-- 取得ボタン -->
    <button class="btn" onclick="fetchAll()">別の内容を取得する</button>
    
    <!-- ローディング表示 -->
    <div id="loading" class="status-msg">データを取得・翻訳中...</div>

    <!-- 3カラム表示エリア (左GIF / 中央名言 / 右GIF) -->
    <div id="content-grid" class="content-grid" style="display: none;">
      
      <!-- 左側：GIF 1 -->
      <div class="card gif-card">
        <img id="gif-img-left" src="" alt="左GIF">
      </div>

      <!-- 中央：名言 -->
      <div class="card quote-card">
        <div class="quote-ja" id="quote-ja"></div>
        <div class="quote-en" id="quote-en"></div>
        <div class="author" id="quote-author"></div>
      </div>

      <!-- 右側：GIF 2 -->
      <div class="card gif-card">
        <img id="gif-img-right" src="" alt="右GIF">
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'both';

    // 表示モードの切り替え関数
    function switchMode(mode) {
      currentMode = mode;
      
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const jaEl = document.getElementById('quote-ja');
      const enEl = document.getElementById('quote-en');

      if (mode === 'both') {
        jaEl.style.display = 'block';
        enEl.style.display = 'block';
      } else if (mode === 'ja') {
        jaEl.style.display = 'block';
        enEl.style.display = 'none';
      } else if (mode === 'en') {
        jaEl.style.display = 'none';
        enEl.style.display = 'block';
      }
    }

    // Google翻訳API（無料）
    async function translateToJapanese(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        return data[0].map(item => item[0]).join('');
      } catch (error) {
        console.error('翻訳エラー:', error);
        return text;
      }
    }

    // 1. 名言の取得と翻訳
    async function fetchQuote() {
      const response = await fetch('https://dummyjson.com/quotes/random');
      if (!response.ok) throw new Error('名言の取得に失敗しました');

      const data = await response.json();
      const translatedText = await translateToJapanese(data.quote);

      document.getElementById('quote-ja').textContent = `“ ${translatedText} ”`;
      document.getElementById('quote-en').textContent = `“ ${data.quote} ”`;
      document.getElementById('quote-author').textContent = `— ${data.author}`;
    }

    // 2. GIFの取得（指定したID要素に挿入する関数）
    async function fetchGifToElement(elementId) {
      const apiKey = 'dc6zaTOxFJmzC';
      const tags = ['funny', 'cat', 'happy', 'cool', 'dance', 'anime', 'art', 'reaction'];
      const randomTag = tags[Math.floor(Math.random() * tags.length)];

      const response = await fetch(`https://api.giphy.com/v1/gifs/random?api_key=${apiKey}&tag=${randomTag}`);
      if (!response.ok) throw new Error('GIFの取得に失敗しました');

      const data = await response.json();
      const gifUrl = data.data.images.original.url;
      
      document.getElementById(elementId).src = gifUrl;
    }

    // 名言 ＆ 左右のGIF（合計3つのリクエスト）を一括で並列取得
    async function fetchAll() {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('content-grid');
      
      loadingEl.style.display = 'block';
      gridEl.style.display = 'none';

      try {
        // Promise.all で名言・左GIF・右GIFの3つを同時に処理
        await Promise.all([
          fetchQuote(),
          fetchGifToElement('gif-img-left'),
          fetchGifToElement('gif-img-right')
        ]);

        loadingEl.style.display = 'none';
        gridEl.style.display = 'grid';

      } catch (error) {
        console.error('エラーが発生しました:', error);
        loadingEl.textContent = 'データの取得に失敗しました。再試行してください。';
      }
    }

    // ページ読み込み時に実行
    fetchAll();
  </script>

</body>
</html>
