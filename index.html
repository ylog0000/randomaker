<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルシファー 名言集（API取得テスト）</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #e50914;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    .card {
      background: #2b2b2b;
      border-left: 5px solid #e50914;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-align: left;
    }
    .quote {
      font-size: 1.1rem;
      line-height: 1.6;
      font-style: italic;
      color: #e0e0e0;
    }
    .author {
      margin-top: 15px;
      text-align: right;
      font-weight: bold;
      color: #e50914;
    }
    .btn {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background-color: #b20710;
    }
    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lucifer 名言ジェネレーター</h1>
    <button class="btn" onclick="fetchQuote()">別の名言を取得する</button>
    
    <div id="loading">名言を取得中...</div>
    <div id="quote-card" class="card" style="display: none;">
      <div class="quote" id="quote-text"></div>
      <div class="author" id="quote-author"></div>
    </div>
  </div>

  <script>
    // キャラクター名の日本語変換辞書
    const authorMap = {
      "Lucifer Morningstar": "ルシファー・モーニングスター",
      "Chloe Decker": "クロエ・デッカー",
      "Amenadiel": "アメナディエル",
      "Mazikeen": "マジキーン（メズ）",
      "Linda Martin": "リンダ・マーティン",
      "Dan Espinoza": "ダン・エスピノーザ",
      "Ella Lopez": "エラ・ロペス"
    };

    // 主な名言の日本語訳辞書（APIから取得した英語を判定して置き換え）
    const quoteMap = {
      "Crime solving Devil. It makes sense. Don't think about it too hard.": 
        "犯罪を解決する悪魔。理にかなってるだろ。あまり深く考えるなよ。",
      "Tell me, what is it you truly desire?": 
        "教えてくれ、君が本当に望んでいるものは何だ？",
      "People don't have power over you. We give it to them.": 
        "他人が君を支配する力なんて最初から持っていない。君がそれを与えているんだ。",
      "Sometimes we need to lose something to realize what it means to us.": 
        "それが自分にとって何を意味していたのかを知るために、時には何かを失う必要がある。"
    };

    // 名言を取得する関数
    async function fetchQuote() {
      const loadingEl = document.getElementById('loading');
      const cardEl = document.getElementById('quote-card');
      
      loadingEl.style.display = 'block';
      cardEl.style.display = 'none';

      try {
        // ご指定のAPIへGETリクエストを送信
        const response = await fetch('https://lucifer-quotes.vercel.app/api/quotes');
        const data = await response.json();

        // 配列の1件目を取り出す（例: [{ quote: "...", author: "..." }]）
        const quoteObj = data[0];

        // 辞書を使って日本語化（無ければ英語のまま表示）
        const authorJa = authorMap[quoteObj.author] || quoteObj.author;
        const quoteJa = quoteMap[quoteObj.quote] || quoteObj.quote;

        // 画面のテキストを更新
        document.getElementById('quote-text').textContent = `“ ${quoteJa} ”`;
        document.getElementById('quote-author').textContent = `— ${authorJa} (${quoteObj.author})`;

        loadingEl.style.display = 'none';
        cardEl.style.display = 'block';

      } catch (error) {
        console.error('エラー発生:', error);
        loadingEl.textContent = 'データの取得に失敗しました。';
      }
    }

    // ページ読み込み時に実行
    fetchQuote();
  </script>

</body>
</html>
