<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の名言 🐱 ランダムCatジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    /* タイトルCSS */
    h1 {
      color: #4da6ff;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .moving-cat {
      display: inline-block;
      font-size: 1.4em;
      animation: cat-bounce 1.5s infinite ease-in-out;
    }

    @keyframes cat-bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(10deg); }
    }

    .center-cat {
      font-size: 1.2em;
      margin: 0 4px;
      display: inline-block;
      animation: center-rotate 4.5s infinite linear;
    }

    @keyframes center-rotate {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.6) rotate(90deg); }
      50% { transform: scale(2.2) rotate(180deg); }
      75% { transform: scale(1.77) rotate(270deg); }
      100% { transform: scale(1) rotate(360deg); }
    }

    .toggle-buttons {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .toggle-btn {
      background-color: #333;
      color: #aaa;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toggle-btn.active {
      background-color: #4da6ff;
      color: #fff;
      border-color: #4da6ff;
    }
    .btn {
      background-color: #4da6ff;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 25px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0073e6;
    }
    
    /* --- 中央ローディング（流れるドット） --- */
    .loading-box {
      margin: 40px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .loading-text {
      font-size: 1.2rem;
      color: #4da6ff;
      display: flex;
      align-items: center;
    }

    /* 流れるドットのアニメーション */
    .dots span {
      animation: dot-wave 1.4s infinite;
      opacity: 0;
      display: inline-block;
    }
    .dots span:nth-child(1) { animation-delay: 0s; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-wave {
      0%, 100% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* --- レイアウト --- */
    .content-grid {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 20px;
      align-items: center;
      text-align: left;
    }

    @media (max-width: 850px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #2b2b2b;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      min-height: 220px;
    }

    .quote-card {
      border-left: 5px solid #4da6ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .quote-ja {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .quote-en {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #bbb;
      font-style: italic;
    }
    .author {
      margin-top: 15px;
      text-align: right;
      font-weight: bold;
      color: #4da6ff;
    }

    /* --- 左右GIFカード（回転する足跡） --- */
    .gif-card {
      border-top: 4px solid #ff4d88;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
    }
    .gif-card img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 6px;
      object-fit: contain;
      display: none;
    }
    
    /* 左右の回る足跡アイコン */
    .spinner-paw {
      font-size: 2.2rem;
      display: inline-block;
      animation: spin-paw 1.2s infinite linear;
      position: absolute;
    }

    @keyframes spin-paw {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>
      <span class="moving-cat">🐈</span>
      世界の名言 <span class="center-cat">🐱</span> ランダムCat
      <span class="moving-cat">🐈‍⬛</span>
    </h1>
    
    <div class="toggle-buttons">
      <button class="toggle-btn active" onclick="switchMode('both')">両方表示</button>
      <button class="toggle-btn" onclick="switchMode('ja')">日本語のみ</button>
      <button class="toggle-btn" onclick="switchMode('en')">English</button>
    </div>

    <button class="btn" onclick="fetchAll()">別の内容を取得する</button>
    
    <!-- 中央メインの流れる「...」ローディング -->
    <div id="loading" class="loading-box">
      <div id="loading-text" class="loading-text">
        名言を探しています<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>

    <div id="content-grid" class="content-grid" style="display: none;">
      
      <!-- 左側：猫カード（足跡ロード） -->
      <div class="card gif-card">
        <span id="gif-status-left" class="spinner-paw">🐾</span>
        <img id="gif-img-left" src="" alt="左Cat">
      </div>

      <!-- 中央：名言カード -->
      <div class="card quote-card">
        <div class="quote-ja" id="quote-ja"></div>
        <div class="quote-en" id="quote-en"></div>
        <div class="author" id="quote-author"></div>
      </div>

      <!-- 右側：猫カード（足跡ロード） -->
      <div class="card gif-card">
        <span id="gif-status-right" class="spinner-paw">🐾</span>
        <img id="gif-img-right" src="" alt="右Cat">
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'both';

    function switchMode(mode) {
      currentMode = mode;
      
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      const target = event ? event.target : document.querySelector(`[onclick="switchMode('${mode}')"]`);
      if(target) target.classList.add('active');

      const jaEl = document.getElementById('quote-ja');
      const enEl = document.getElementById('quote-en');

      if (mode === 'both') {
        jaEl.style.display = 'block';
        enEl.style.display = 'block';
      } else if (mode === 'ja') {
        jaEl.style.display = 'block';
        enEl.style.display = 'none';
      } else if (mode === 'en') {
        jaEl.style.display = 'none';
        enEl.style.display = 'block';
      }
    }

    async function translateToJapanese(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        if(!response.ok) return text;
        const data = await response.json();
        return data[0].map(item => item[0]).join('');
      } catch (error) {
        console.error('翻訳エラー:', error);
        return text;
      }
    }

    async function fetchQuote() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      const response = await fetch('https://dummyjson.com/quotes/random', { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('名言の取得に失敗しました');

      const data = await response.json();
      const translatedText = await translateToJapanese(data.quote);

      document.getElementById('quote-ja').textContent = `“ ${translatedText} ”`;
      document.getElementById('quote-en').textContent = `“ ${data.quote} ”`;
      document.getElementById('quote-author').textContent = `— ${data.author}`;
    }

    async function fetchSingleCatForBoth() {
      const imgLeft = document.getElementById('gif-img-left');
      const imgRight = document.getElementById('gif-img-right');
      const statusLeft = document.getElementById('gif-status-left');
      const statusRight = document.getElementById('gif-status-right');

      [imgLeft, imgRight].forEach(el => el.style.display = 'none');
      [statusLeft, statusRight].forEach(el => {
        el.className = 'spinner-paw';
        el.textContent = '🐾';
        el.style.display = 'inline-block';
      });

      try {
        const response = await fetch('https://api.thecatapi.com/v1/images/search');
        if (!response.ok) throw new Error('Cat APIエラー');

        const data = await response.json();
        const catUrl = data[0].url;

        imgLeft.src = catUrl;
        imgRight.src = catUrl;

        imgLeft.onload = () => {
          [statusLeft, statusRight].forEach(el => el.style.display = 'none');
          [imgLeft, imgRight].forEach(el => el.style.display = 'inline-block');
        };

        imgLeft.onerror = () => {
          [statusLeft, statusRight].forEach(el => {
            el.className = '';
            el.textContent = '（画像の読み込み失敗）';
          });
        };

      } catch (error) {
        console.error('Cat取得失敗:', error);
        [statusLeft, statusRight].forEach(el => {
          el.className = '';
          el.textContent = '（Cat APIダウン中）';
        });
      }
    }

    async function fetchAll() {
      const loadingEl = document.getElementById('loading');
      const loadingTextEl = document.getElementById('loading-text');
      const gridEl = document.getElementById('content-grid');
      
      loadingEl.style.display = 'flex';
      loadingTextEl.innerHTML = '名言を探しています<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      gridEl.style.display = 'none';

      try {
        await fetchQuote();

        loadingEl.style.display = 'none';
        gridEl.style.display = 'grid';

        fetchSingleCatForBoth();

      } catch (error) {
        console.error('決定的なエラー:', error);
        loadingEl.style.display = 'flex';
        loadingTextEl.textContent = '名言の取得に失敗しました。再試行してください。';
      }
    }

    fetchAll();
  </script>

</body>
</html>
