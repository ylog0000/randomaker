<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の名言 ランダムジェネレーター</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      color: #4da6ff;
      margin-bottom: 20px;
    }
    .toggle-buttons {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .toggle-btn {
      background-color: #333;
      color: #aaa;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toggle-btn.active {
      background-color: #4da6ff;
      color: #fff;
      border-color: #4da6ff;
    }
    .btn {
      background-color: #4da6ff;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 25px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0073e6;
    }
    
    /* 3カラムレイアウト： [左Cat (240px)] [中央名言 (1fr)] [右Cat (240px)] */
    .content-grid {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 20px;
      align-items: center;
      text-align: left;
    }

    /* スマホ表示では1列に並べる */
    @media (max-width: 850px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #2b2b2b;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      min-height: 220px;
    }

    /* 中央：名言カード */
    .quote-card {
      border-left: 5px solid #4da6ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .quote-ja {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .quote-en {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #bbb;
      font-style: italic;
    }
    .author {
      margin-top: 15px;
      text-align: right;
      font-weight: bold;
      color: #4da6ff;
    }

    /* 左右：Catカード */
    .gif-card {
      border-top: 4px solid #ff4d88;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
    }
    .gif-card img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 6px;
      object-fit: contain;
      display: none; /* 初期は非表示 */
    }
    .gif-loading-msg {
      color: #888;
      font-size: 0.9rem;
      position: absolute;
    }

    .status-msg {
      text-align: center;
      font-size: 1.1rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>世界の名言 ＆ ランダムCat</h1>
    
    <!-- 言語切り替えボタン -->
    <div class="toggle-buttons">
      <button class="toggle-btn active" onclick="switchMode('both')">両方表示</button>
      <button class="toggle-btn" onclick="switchMode('ja')">日本語のみ</button>
      <button class="toggle-btn" onclick="switchMode('en')">English</button>
    </div>

    <!-- 取得ボタン -->
    <button class="btn" onclick="fetchAll()">別の内容を取得する</button>
    
    <!-- ローディング表示（メイン） -->
    <div id="loading" class="status-msg">名言を取得中...</div>

    <!-- 3カラム表示エリア (左Cat / 中央名言 / 右Cat) -->
    <div id="content-grid" class="content-grid" style="display: none;">
      
      <!-- 左側：Cat -->
      <div class="card gif-card">
        <span id="gif-status-left" class="gif-loading-msg">Cat読み込み中...</span>
        <img id="gif-img-left" src="" alt="左Cat">
      </div>

      <!-- 中央：名言 -->
      <div class="card quote-card">
        <div class="quote-ja" id="quote-ja"></div>
        <div class="quote-en" id="quote-en"></div>
        <div class="author" id="quote-author"></div>
      </div>

      <!-- 右側：Cat -->
      <div class="card gif-card">
        <span id="gif-status-right" class="gif-loading-msg">Cat読み込み中...</span>
        <img id="gif-img-right" src="" alt="右Cat">
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'both';

    function switchMode(mode) {
      currentMode = mode;
      
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      const target = event ? event.target : document.querySelector(`[onclick="switchMode('${mode}')"]`);
      if(target) target.classList.add('active');

      const jaEl = document.getElementById('quote-ja');
      const enEl = document.getElementById('quote-en');

      if (mode === 'both') {
        jaEl.style.display = 'block';
        enEl.style.display = 'block';
      } else if (mode === 'ja') {
        jaEl.style.display = 'block';
        enEl.style.display = 'none';
      } else if (mode === 'en') {
        jaEl.style.display = 'none';
        enEl.style.display = 'block';
      }
    }

    // Google翻訳API（無料）
    async function translateToJapanese(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        if(!response.ok) return text;
        const data = await response.json();
        return data[0].map(item => item[0]).join('');
      } catch (error) {
        console.error('翻訳エラー:', error);
        return text;
      }
    }

    // 1. 名言の取得と翻訳
    async function fetchQuote() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const response = await fetch('https://dummyjson.com/quotes/random', { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error('名言の取得に失敗しました');

      const data = await response.json();
      const translatedText = await translateToJapanese(data.quote);

      document.getElementById('quote-ja').textContent = `“ ${translatedText} ”`;
      document.getElementById('quote-en').textContent = `“ ${data.quote} ”`;
      document.getElementById('quote-author').textContent = `— ${data.author}`;
    }

    // 2. 猫画像の取得（GIPHYを廃止し、RandomCat APIを使用）
    async function fetchSingleCatForBoth() {
      const imgLeft = document.getElementById('gif-img-left');
      const imgRight = document.getElementById('gif-img-right');
      const statusLeft = document.getElementById('gif-status-left');
      const statusRight = document.getElementById('gif-status-right');

      // リセット
      [imgLeft, imgRight].forEach(el => el.style.display = 'none');
      [statusLeft, statusRight].forEach(el => {
        el.style.display = 'block';
        el.textContent = 'Cat読み込み中...';
      });

      try {
        // CROS対応・登録不要のRandomCat APIを使用
        const response = await fetch('https://aws.random.cat/meow');
        if (!response.ok) throw new Error('Cat APIエラー');

        const data = await response.json();
        const catUrl = data.file; // 猫画像のURL

        // 左右同時に同じURLをセット
        imgLeft.src = catUrl;
        imgRight.src = catUrl;

        imgLeft.onload = () => {
          [statusLeft, statusRight].forEach(el => el.style.display = 'none');
          [imgLeft, imgRight].forEach(el => el.style.display = 'inline-block');
        };

        imgLeft.onerror = () => {
          [statusLeft, statusRight].forEach(el => el.textContent = '（画像の読み込み失敗）');
        };

      } catch (error) {
        console.error('Cat取得失敗（非表示）:', error);
        [statusLeft, statusRight].forEach(el => el.textContent = '（Cat APIエラー）');
      }
    }

    // メイン処理
    async function fetchAll() {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('content-grid');
      
      loadingEl.style.display = 'block';
      loadingEl.textContent = '名言を取得中...';
      gridEl.style.display = 'none';

      try {
        await fetchQuote();

        loadingEl.style.display = 'none';
        gridEl.style.display = 'grid';

        // 左右同じ猫画像を表示（失敗してもエラー画面にしない）
        fetchSingleCatForBoth();

      } catch (error) {
        console.error('決定的なエラー:', error);
        loadingEl.style.display = 'block';
        loadingEl.textContent = '名言の取得に失敗しました。時間をおいて再試行してください。';
      }
    }

    // ページ読み込み時に実行
    fetchAll();
  </script>

</body>
</html>
